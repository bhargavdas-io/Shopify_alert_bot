name: Perfume Stock Checker

on:
  schedule:
    - cron: '*/15 * * * *' # Runs every 15 minutes
  workflow_dispatch: # Allows you to manually click a "Run" button to test it

jobs:
  check-stock:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
        
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests
          
      - name: Run Stock Checker
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_SECRETS }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_ID }}
        run: python stock_checker.py
